server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Vite puts a hash in these file names, so they can be cached for a long time
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The website handles its own routes (/tree, /people, ...): always answer with index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}